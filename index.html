<!doctype <!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مهاب | القرآن الكريم</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f5f7f6;color:#17352b;transition:.25s}
body.dark{background:#101715;color:#eef7f2}
header{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#0b5a40,#159265);color:#fff;padding:18px;text-align:center;box-shadow:0 3px 14px #0002}
.logo{font-size:30px;font-weight:700}.sub{font-size:13px;opacity:.9;margin-top:4px}
main{max-width:1000px;margin:auto;padding:22px 14px 60px}.hero,.reader-head,.ayahs{background:#fff;border:1px solid #e1e9e5;border-radius:20px}
.dark .hero,.dark .reader-head,.dark .ayahs,.dark .surah,.dark input{background:#19221f;color:#eef7f2;border-color:#2b3933}
.hero{text-align:center;padding:24px;margin-bottom:16px}.hero h1{margin:0;color:#147a55}.hero p{line-height:1.8;color:#6c7b74}
.tools{display:flex;gap:9px;margin-bottom:18px}input{flex:1;padding:14px;border-radius:14px;border:1px solid #dce6e1;font-size:16px;outline:0;background:#fff}
button{border:0;border-radius:12px;padding:12px 15px;background:#147a55;color:#fff;cursor:pointer}.count{color:#718078;font-size:13px;margin:10px 2px}
.surahs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}.surah{background:#fff;border:1px solid #e1e9e5;border-radius:17px;padding:16px;display:flex;align-items:center;gap:12px;cursor:pointer;transition:.18s}.surah:hover{transform:translateY(-2px)}
.num{width:43px;height:43px;border-radius:50%;background:#e6f2ed;color:#0b6849;display:grid;place-items:center;font-weight:bold}.info{flex:1}.name{font-size:18px;font-weight:bold}.meta{font-size:12px;color:#78877f;margin-top:5px}.star{background:transparent;color:#c5962f;padding:3px;font-size:20px}
.reader{display:none}.reader.active{display:block}.list.hidden{display:none}.reader-head{text-align:center;padding:22px;margin-bottom:14px}.reader-head h2{margin:0;color:#147a55;font-size:28px}.reader-head p{color:#718078}.ayahs{padding:20px}.bismillah{text-align:center;color:#b2872c;font-size:24px;margin:5px 0 22px}.ayah{padding:17px 4px;border-bottom:1px solid #e3e9e6;font-family:"Amiri","Traditional Arabic",Tahoma,serif;font-size:25px;line-height:2.2}.ayah:last-child{border:0}.ayah{cursor:pointer;transition:.2s}.ayah.saved{background:#fff8df;border-radius:12px;padding-left:10px;padding-right:10px}.dark .ayah.saved{background:#2b2a1d}.save-note{text-align:center;font-family:Tahoma,Arial,sans-serif;font-size:13px;color:#8a6b20;margin-top:10px}.resume{display:none;margin:0 auto 14px;background:#b2872c}.resume.show{display:block}.n{color:#b2872c;font-size:16px;margin-right:7px}.error{text-align:center;padding:30px;color:#a33}.empty{text-align:center;padding:35px;color:#718078}
footer{text-align:center;color:#718078;font-size:13px;padding:20px}
@media(max-width:600px){.tools{flex-direction:column}.surahs{grid-template-columns:1fr}.ayah{font-size:21px}}
</style>
</head>
<body>
<header><div class="logo">مهاب</div><div class="sub">القرآن الكريم</div></header>
<main>
<section id="list" class="list">
<div class="hero"><h1>﷽</h1><p>القرآن الكريم كاملًا — ١١٤ سورة<br>اقرأ وتدبر كلام الله.</p></div>
<div class="tools"><input id="search" placeholder="🔎 ابحث عن سورة..." oninput="render()"><button onclick="theme()">🌙</button></div>
<div class="count" id="count"></div><div id="surahs" class="surahs"></div>
</section>
<section id="reader" class="reader">
<button onclick="back()">← العودة للسور</button>
<button id="resumeBtn" class="resume" onclick="resumeLast()">📖 متابعة من آخر آية</button>
<div class="reader-head"><h2 id="title"></h2><p id="meta"></p></div>
<div class="ayahs"><div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div><div id="ayahs"></div></div>
</section>
</main>
<footer>مهاب © القرآن الكريم</footer>
<script>
const names=["الفاتحة","البقرة","آل عمران","النساء","المائدة","الأنعام","الأعراف","الأنفال","التوبة","يونس","هود","يوسف","الرعد","إبراهيم","الحجر","النحل","الإسراء","الكهف","مريم","طه","الأنبياء","الحج","المؤمنون","النور","الفرقان","الشعراء","النمل","القصص","العنكبوت","الروم","لقمان","السجدة","الأحزاب","سبأ","فاطر","يس","الصافات","ص","الزمر","غافر","فصلت","الشورى","الزخرف","الدخان","الجاثية","الأحقاف","محمد","الفتح","الحجرات","ق","الذاريات","الطور","النجم","القمر","الرحمن","الواقعة","الحديد","المجادلة","الحشر","الممتحنة","الصف","الجمعة","المنافقون","التغابن","الطلاق","التحريم","الملك","القلم","الحاقة","المعارج","نوح","الجن","المزمل","المدثر","القيامة","الإنسان","المرسلات","النبأ","النازعات","عبس","التكوير","الانفطار","المطففين","الانشقاق","البروج","الطارق","الأعلى","الغاشية","الفجر","البلد","الشمس","الليل","الضحى","الشرح","التين","العلق","القدر","البينة","الزلزلة","العاديات","القارعة","التكاثر","العصر","الهمزة","الفيل","قريش","الماعون","الكوثر","الكافرون","النصر","المسد","الإخلاص","الفلق","الناس"];
const types=["مكية","مدنية"]; 
const counts=[7,286,200,176,120,165,206,75,129,109,123,111,43,52,99,128,111,110,98,135,112,78,118,64,77,227,93,88,69,60,34,30,73,54,45,83,182,88,75,85,54,53,89,59,37,35,38,29,18,45,60,49,62,55,78,96,29,22,24,13,14,11,11,18,12,12,30,52,52,44,28,28,20,56,40,46,42,29,19,36,25,22,17,19,26,30,20,15,21,11,8,8,8,19,5,8,8,11,11,8,3,9,5,4,7,3,6,3,5,4,7,6];
let fav=JSON.parse(localStorage.getItem("mohabFav")||"[]");
function render(){let q=document.getElementById("search").value.trim();let a=names.map((name,i)=>({id:i+1,name,count:counts[i],type:i<87?"مكية":"مدنية"})).filter(x=>x.name.includes(q));document.getElementById("count").textContent=`${a.length} سورة`;document.getElementById("surahs").innerHTML=a.map(s=>`<div class="surah" onclick="openS(${s.id})"><div class="num">${s.id}</div><div class="info"><div class="name">${s.name}</div><div class="meta">${s.type} • ${s.count} آية</div></div><button class="star" onclick="event.stopPropagation();favToggle(${s.id})">${fav.includes(s.id)?"⭐":"☆"}</button></div>`).join("")||'<div class="empty">لا توجد نتائج</div>'}
function favToggle(id){fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];localStorage.setItem("mohabFav",JSON.stringify(fav));render()}
async function openS(id){let s={id,name:names[id-1],count:counts[id-1]};document.getElementById("list").classList.add("hidden");document.getElementById("reader").classList.add("active");document.getElementById("title").textContent="سورة "+s.name;document.getElementById("meta").textContent=`${s.count} آية`;let box=document.getElementById("ayahs");box.innerHTML='<div class="empty">جاري تحميل السورة كاملة...</div>';try{let r=await fetch(`https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`);let j=await r.json();if(j.code!==200)throw 0;let saved=JSON.parse(localStorage.getItem("mohabLast")||"null");box.innerHTML=j.data.ayahs.map(a=>`<div class="ayah ${saved&&saved.surah===id&&saved.ayah===a.numberInSurah?"saved":""}" id="ayah-${a.numberInSurah}" onclick="saveAyah(${id},${a.numberInSurah})">${a.text}<span class="n">﴿${a.numberInSurah}﴾</span></div>`).join("")+'<div class="save-note">اضغط على أي آية لحفظ مكانك والعودة إليها لاحقًا 🔖</div>';updateResumeButton();if(saved&&saved.surah===id){setTimeout(()=>document.getElementById("ayah-"+saved.ayah)?.scrollIntoView({behavior:"smooth",block:"center"}),150)}}catch(e){box.innerHTML='<div class="error">تعذر تحميل القرآن الآن. تأكد من اتصال الإنترنت ثم حاول مرة أخرى.</div>'}}
function saveAyah(surah,ayah){localStorage.setItem("mohabLast",JSON.stringify({surah:surah,ayah:ayah}));document.querySelectorAll(".ayah.saved").forEach(x=>x.classList.remove("saved"));document.getElementById("ayah-"+ayah)?.classList.add("saved");updateResumeButton()}
function updateResumeButton(){let b=document.getElementById("resumeBtn");let saved=JSON.parse(localStorage.getItem("mohabLast")||"null");if(saved){b.textContent=`📖 متابعة: سورة ${names[saved.surah-1]} — الآية ${saved.ayah}`;b.classList.add("show")}else b.classList.remove("show")}
function resumeLast(){let saved=JSON.parse(localStorage.getItem("mohabLast")||"null");if(saved)openS(saved.surah)}
function back(){document.getElementById("reader").classList.remove("active");document.getElementById("list").classList.remove("hidden");window.scrollTo(0,0)}
function theme(){document.body.classList.toggle("dark");localStorage.setItem("mohabDark",document.body.classList.contains("dark"))}
if(localStorage.getItem("mohabDark")==="true")document.body.classList.add("dark");render();updateResumeButton();
</script>
</body>
</html>
