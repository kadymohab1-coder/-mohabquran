<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مهاب | القرآن الكريم</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

:root {
  --bg: #f4f7f5;
  --card: #ffffff;
  --text: #17352b;
  --muted: #718078;
  --main: #167653;
  --main-dark: #0d5b3e;
  --gold: #c99a35;
  --border: #e4ebe7;
}

body.dark {
  --bg: #101816;
  --card: #18221f;
  --text: #eef7f2;
  --muted: #a8b7b0;
  --main: #2aa875;
  --main-dark: #238c62;
  --border: #293630;
}

body {
  font-family: Tahoma, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
  transition: 0.3s;
}

/* Header */
header {
  background: linear-gradient(135deg, var(--main-dark), var(--main));
  color: white;
  padding: 18px 20px;
  position: sticky;
  top: 0;
  z-index: 10;
  box-shadow: 0 4px 15px rgba(0,0,0,.12);
}

.header-content {
  max-width: 1000px;
  margin: auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 27px;
  font-weight: bold;
}

.logo small {
  display: block;
  font-size: 11px;
  opacity: .8;
  font-weight: normal;
}

.theme-btn {
  border: 0;
  background: rgba(255,255,255,.15);
  color: white;
  width: 42px;
  height: 42px;
  border-radius: 50%;
  cursor: pointer;
  font-size: 20px;
}

/* Main */
main {
  max-width: 1000px;
  margin: auto;
  padding: 25px 15px 100px;
}

.hero {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 22px;
  padding: 28px 20px;
  text-align: center;
  margin-bottom: 20px;
}

.hero h1 {
  color: var(--main);
  font-size: 29px;
  margin-bottom: 8px;
}

.hero p {
  color: var(--muted);
  line-height: 1.8;
}

/* Search */
.search-box {
  margin: 20px 0;
  position: relative;
}

.search-box input {
  width: 100%;
  padding: 16px 48px 16px 18px;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text);
  border-radius: 15px;
  font-size: 16px;
  outline: none;
}

.search-box input:focus {
  border-color: var(--main);
}

.search-icon {
  position: absolute;
  right: 17px;
  top: 14px;
  font-size: 20px;
}

/* Section */
.section-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin: 22px 2px 12px;
}

.section-title h2 {
  font-size: 20px;
}

.counter {
  color: var(--muted);
  font-size: 13px;
}

/* Surah cards */
.surahs {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 12px;
}

.surah {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 17px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: .2s;
}

.surah:hover {
  transform: translateY(-2px);
  border-color: var(--main);
}

.number {
  width: 42px;
  height: 42px;
  border-radius: 50%;
  background: #e7f2ed;
  color: var(--main-dark);
  display: grid;
  place-items: center;
  font-weight: bold;
}

body.dark .number {
  background: #20372f;
  color: #75d4aa;
}

.surah-info {
  flex: 1;
}

.surah-name {
  font-size: 18px;
  font-weight: bold;
}

.surah-meta {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
}

.star {
  border: 0;
  background: transparent;
  cursor: pointer;
  font-size: 21px;
}

/* Reading screen */
.reader {
  display: none;
}

.reader.active {
  display: block;
}

.surah-list.hidden {
  display: none;
}

.back-btn {
  border: 0;
  background: var(--main);
  color: white;
  padding: 11px 17px;
  border-radius: 12px;
  cursor: pointer;
  margin-bottom: 15px;
}

.reader-head {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  text-align: center;
  padding: 25px 15px;
  margin-bottom: 15px;
}

.reader-head h2 {
  color: var(--main);
  font-size: 28px;
}

.reader-head p {
  color: var(--muted);
  margin-top: 8px;
}

.ayahs {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 25px 18px;
}

.bismillah {
  text-align: center;
  font-size: 25px;
  color: var(--gold);
  margin-bottom: 25px;
}

.ayah {
  padding: 18px 5px;
  border-bottom: 1px solid var(--border);
  font-family: "Amiri", "Traditional Arabic", Tahoma, serif;
  font-size: 25px;
  line-height: 2.2;
}

.ayah:last-child {
  border-bottom: 0;
}

.ayah-number {
  color: var(--gold);
  font-size: 17px;
  margin-right: 7px;
  white-space: nowrap;
}

/* Bottom */
footer {
  text-align: center;
  color: var(--muted);
  font-size: 13px;
  padding: 25px;
}

@media(max-width:600px) {
  .logo {
    font-size: 23px;
  }

  .hero h1 {
    font-size: 24px;
  }

  .surahs {
    grid-template-columns: 1fr;
  }

  .ayah {
    font-size: 22px;
    line-height: 2;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-content">
    <div class="logo">
      مهاب
      <small>القرآن الكريم</small>
    </div>

    <button class="theme-btn" onclick="toggleTheme()" title="الوضع الليلي">
      🌙
    </button>
  </div>
</header>

<main>

  <!-- قائمة السور -->
  <section id="surahList" class="surah-list">

    <div class="hero">
      <h1>﷽</h1>
      <p>
        أهلاً بك في تطبيق مهاب للقرآن الكريم<br>
        اقرأ وتدبر كلام الله في أي وقت.
      </p>
    </div>

    <div class="search-box">
      <span class="search-icon">🔎</span>
      <input
        id="search"
        type="text"
        placeholder="ابحث عن سورة..."
        oninput="searchSurahs()"
      >
    </div>

    <div class="section-title">
      <h2>سور القرآن الكريم</h2>
      <span class="counter" id="counter">114 سورة</span>
    </div>

    <div id="surahs" class="surahs"></div>

  </section>

  <!-- شاشة القراءة -->
  <section id="reader" class="reader">

    <button class="back-btn" onclick="backToList()">
      ← العودة للسور
    </button>

    <div class="reader-head">
      <h2 id="readerTitle"></h2>
      <p id="readerInfo"></p>
    </div>

    <div class="ayahs">
      <div class="bismillah">بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيمِ</div>
      <div id="ayahContainer"></div>
    </div>

  </section>

</main>

<footer>
  مهاب © القرآن الكريم
</footer>

const surahsBox = document.getElementById("surahs");
const counter = document.getElementById("counter");

function getFavorites() {
  return JSON.parse(localStorage.getItem("mohabFavorites") || "[]");
}

function toggleFavorite(event, id) {
  event.stopPropagation();

  let favorites = getFavorites();

  if (favorites.includes(id)) {
    favorites = favorites.filter(x => x !== id);
  } else {
    favorites.push(id);
  }

  localStorage.setItem("mohabFavorites", JSON.stringify(favorites));
  renderSurahs(document.getElementById("search").value);
}

function renderSurahs(filter = "") {

  const favorites = getFavorites();

  const filtered = surahs.filter(s =>
    s[1].includes(filter.trim())
  );

  counter.textContent = `${filtered.length} سورة`;

  surahsBox.innerHTML = filtered.map(s => {

    const favorite = favorites.includes(s[0]);

    return `
      <div class="surah" onclick="openSurah(${s[0]})">

        <div class="number">${s[0]}</div>

        <div class="surah-info">
          <div class="surah-name">${s[1]}</div>
          <div class="surah-meta">
            ${s[3]} • ${s[2]} آية
          </div>
        </div>

        <button
          class="star"
          onclick="toggleFavorite(event, ${s[0]})"
          title="المفضلة"
        >
          ${favorite ? "⭐" : "☆"}
        </button>

      </div>
    `;

  }).join("");
}

function searchSurahs() {
  renderSurahs(document.getElementById("search").value);
}

async function openSurah(id) {

  const surah = surahs.find(s => s[0] === id);

  document.getElementById("surahList").classList.add("hidden");
  document.getElementById("reader").classList.add("active");

  document.getElementById("readerTitle").textContent =
    `سورة ${surah[1]}`;

  document.getElementById("readerInfo").textContent =
    `${surah[3]} • ${surah[2]} آية`;

  const container = document.getElementById("ayahContainer");

  container.innerHTML =
    `<p style="text-align:center;padding:30px;color:var(--muted)">
      جاري تحميل السورة...
    </p>`;

  try {

    const response = await fetch(
      `https://api.alquran.cloud/v1/surah/${id}/quran-uthmani`
    );

    const data = await response.json();

    if (!data.data || !data.data.ayahs) {
      throw new Error("API Error");
    }

    container.innerHTML = data.data.ayahs.map(ayah => `
      <div class="ayah">
        ${ayah.text}
        <span class="ayah-number">
          ﴿${ayah.numberInSurah}﴾
        </span>
      </div>
    `).join("");

    localStorage.setItem("mohabLastSurah", id);

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  } catch (error) {

    container.innerHTML = `
      <div style="text-align:center;padding:30px">
        <p style="color:#c0392b">
          تعذر تحميل السورة حالياً.
        </p>
        <p style="margin-top:10px;color:var(--muted)">
          تأكد من اتصالك بالإنترنت ثم حاول مرة أخرى.
        </p>
      </div>
    `;

  }
}

function backToList() {
  document.getElementById("reader").classList.remove("active");
  document.getElementById("surahList").classList.remove("hidden");

  window.scrollTo({
    top: 0,
    behavior: "smooth"
  });
}

function toggleTheme() {

  document.body.classList.toggle("dark");

  const dark =
    document.body.classList.contains("dark");

  localStorage.setItem("mohabDarkMode", dark);

  document.querySelector(".theme-btn").textContent =
    dark ? "☀️" : "🌙";
}

function loadTheme() {

  const dark =
    localStorage.getItem("mohabDarkMode") === "true";

  if (dark) {
    document.body.classList.add("dark");
    document.querySelector(".theme-btn").textContent = "☀️";
  }
}

renderSurahs();
loadTheme();
</script>
